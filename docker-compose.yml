services:
  # Load balancer & reverse proxy (entry point: http://localhost:8080)
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api-1
      - api-2

  # React SPA static build
  web:
    build:
      context: ./frontend

  # Stateless Fastify API Replica 1
  api-1:
    build:
      context: ./backend
    environment:
      PORT: 4000
      INSTANCE_ID: api-1
      JWT_SECRET: ${JWT_SECRET:-replace-with-strong-production-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      DATABASE_URL: postgres://books:books_pass@postgres:5432/bookportal
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: books
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # Stateless Fastify API Replica 2
  api-2:
    build:
      context: ./backend
    environment:
      PORT: 4000
      INSTANCE_ID: api-2
      JWT_SECRET: ${JWT_SECRET:-replace-with-strong-production-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      DATABASE_URL: postgres://books:books_pass@postgres:5432/bookportal
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: books
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # Shared PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books_pass
      POSTGRES_DB: bookportal
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d bookportal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared S3-compatible object storage for uploaded books & covers
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
